# Publica los episodios que la rutina de la mañana deja en ramas claude/.
# Corre siempre el código de main: lo que llega de claude/ solo se lee como texto.
# También pone voz a los borradores de especiales (borradores/…-especial-<slug>.md en ramas claude/borrador-*):
# van a una Release PRERELEASE borrador-<slug>, fuera de la web y de los feeds. La skill /especial lo lanza a mano
# (gh workflow run publicar.yml --ref main) para no esperar al reloj.
name: Publicar episodios

on:
  schedule:
    - cron: "*/20 4-13 * * *"   # cada 20 minutos de 4:00 a 13:59 UTC (de 5-6 h a 14-15 h en Madrid)
  workflow_dispatch:
    inputs:
      rehacer:
        description: "Volver a poner voz a lo publicado (voz, aviso y despedida de la config actual): «todos» o claves separadas por comas (2026-10-08-parte). Vacío: lo normal."
        required: false
        default: ""
  push:
    # Un cambio de diseño rehace la web sin esperar al episodio siguiente (job solo_web: sin voz ni clave).
    branches: [main]
    paths:
      - "scripts/sitio.py"
      - "assets/**"
      - "config/programas.json"

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  comprobar:
    # Sin clave ni permisos de escritura: solo mira si hay algo nuevo y válido.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nuevos: ${{ steps.mirar.outputs.nuevos }}
      rechazados: ${{ steps.mirar.outputs.rechazados }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pruebas
        run: python3 -m unittest discover -s tests -v
      - id: mirar
        name: ¿Hay episodios nuevos?
        env:
          GH_TOKEN: ${{ github.token }}
          REHACER: ${{ inputs.rehacer }}
          RECHAZOS_FICHERO: ${{ runner.temp }}/rechazos.txt
        run: python3 scripts/publicar.py --solo-comprobar
      - name: Devolver el guion rechazado a la rutina, al momento
        # Dispara la rutina por su API con los errores: corrige el guion en su rama y lo vuelve a subir; el reloj
        # lo publica en la pasada siguiente. Token del disparador API de la rutina (claude.ai/code/routines).
        if: steps.mirar.outputs.rechazados != '0'
        env:
          RUTINA_FIRE_TOKEN: ${{ secrets.RUTINA_FIRE_TOKEN }}
          RECHAZOS_FICHERO: ${{ runner.temp }}/rechazos.txt
        run: |
          if [ ! -s "$RECHAZOS_FICHERO" ]; then echo "Solo hay borradores rechazados: no es cosa de la rutina."; exit 0; fi
          if [ -z "$RUTINA_FIRE_TOKEN" ]; then echo "::warning::Falta el secreto RUTINA_FIRE_TOKEN: no puedo avisar a la rutina."; exit 0; fi
          python3 - <<'PY' > "$RUNNER_TEMP/fire.json"
          import json, os
          errores = open(os.environ["RECHAZOS_FICHERO"], encoding="utf-8").read()
          print(json.dumps({"text": "El validador de GitHub ha rechazado este guion y no se publicará hasta que lo corrijas:\n\n" + errores}))
          PY
          curl -sS --fail-with-body -X POST "https://api.anthropic.com/v1/claude_code/routines/trig_01AuPY3LjQVv88mbVQJWuVmC/fire" \
            -H "Authorization: Bearer $RUTINA_FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/fire.json" | head -c 400; echo
      - name: Avisar de un episodio rechazado
        if: steps.mirar.outputs.rechazados != '0'
        run: |
          echo "La rutina dejó un episodio que no pasa el validador. Mira el paso anterior (ya se le ha devuelto)."
          exit 1

  publicar:
    needs: comprobar
    if: needs.comprobar.outputs.nuevos != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear Releases con el audio
    environment:
      name: publicar   # aquí vive GOOGLE_TTS_KEY; solo desde main; la primera semana pide su aprobación
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Herramientas
        run: which ffmpeg ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Token de la voz Gemini (cuenta de servicio de voz-claves, solo rol «Usuario de Agent Platform»)
        id: voz_gemini
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_VOZ_GEMINI_SA }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Recoger, validar, poner voz y publicar
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GOOGLE_VOZ_TOKEN: ${{ steps.voz_gemini.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
          REHACER: ${{ inputs.rehacer }}
        run: python3 scripts/publicar.py --sitio _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  solo_web:
    # Sin episodios nuevos, a mano o tras un cambio de diseño: rehace la web con lo ya publicado. Sin clave.
    needs: comprobar
    if: needs.comprobar.outputs.nuevos == '0' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rehacer la web
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publicar.py --sin-voz --sitio _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  web:
    needs: [publicar, solo_web]
    if: always() && (needs.publicar.result == 'success' || needs.solo_web.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - id: desplegar
        uses: actions/deploy-pages@v4
